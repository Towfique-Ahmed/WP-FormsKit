name: Build plugin packages

# Produces installable ZIPs for both plugins.
#  - On every push/PR to main: build and upload as downloadable workflow artifacts.
#  - On a version tag (v*): also attach the ZIPs to a GitHub Release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ZIP packages
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wp-formskit-plugins
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach ZIPs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wp-formskit-*.zip
